# Optional: run a local Jenkins instance for the CI pipeline.
#   docker compose -f docker-compose.yml -f docker-compose.jenkins.yml up -d
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    restart: on-failure

volumes:
  jenkins_home:
    external: true
